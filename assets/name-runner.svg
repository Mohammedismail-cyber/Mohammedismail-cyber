      <rect x="-7" y="-16" width="14" height="9" rx="2" fill="url(#runnerGrad)"/>
      <rect x="-8" y="-7" width="16" height="9" rx="2" fill="url(#runnerGrad)"/>
      <rect x="-7" y="2" width="4" height="7" fill="#C7B9FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.22s" repeatCount="indefinite"/>
      </rect>
      <rect x="3" y="2" width="4" height="7" fill="#C7B9FF">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="0.22s" repeatCount="indefinite"/>
      </rect>
    </g>
    <animateMotion dur="6s" repeatCount="indefinite"
